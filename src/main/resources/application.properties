# Quarkus HTTP Port
quarkus.http.port=8081

# Default DecisionModel: Local ClassOne Model (devops-thiago/classone-gemma4-e2b)
quarkus.langchain4j.typesafe.base-url=http://127.0.0.1:8000/
quarkus.langchain4j.typesafe.decision-model.model-name=devops-thiago/classone-gemma4-e2b
quarkus.langchain4j.typesafe.decision-model.log-requests=true
quarkus.langchain4j.typesafe.decision-model.log-responses=true

# Named DecisionModel "jev": Cloud TypeSafe Jev (jev-latest)
quarkus.langchain4j.typesafe.jev.base-url=${TYPESAFE_BASE_URL:http://127.0.0.1:8000/jev/}
quarkus.langchain4j.typesafe.jev.decision-model.model-name=jev-latest
quarkus.langchain4j.typesafe.jev.api-key=${JEV_TOKEN:none}
quarkus.langchain4j.typesafe.jev.decision-model.timeout=10s
quarkus.langchain4j.typesafe.jev.decision-model.max-retries=1
quarkus.langchain4j.typesafe.jev.decision-model.log-requests=true
quarkus.langchain4j.typesafe.jev.decision-model.log-responses=true

# GraalVM Native Image Runtime Initialization
quarkus.native.additional-build-args=--initialize-at-run-time=dev.langchain4j.internal.RetryUtils
